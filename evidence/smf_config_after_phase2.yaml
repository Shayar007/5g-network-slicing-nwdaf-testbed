log_level:
  general: debug
register_nf:
  general: yes
http_version: 2

snssais:
  - &embb_slice
    sst: 1
    sd: 'FFFFFF'
  - &urllc_slice
    sst: 2
    sd: '000002'
  - &mmtc_slice
    sst: 3
    sd: '000003'

nfs:
  amf:
    host: oai-amf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
    n2:
      interface_name: eth0
      port: 38412
  smf:
    host: oai-smf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
    n4:
      interface_name: eth0
      port: 8805
  upf:
    host: oai-upf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
    n3:
      interface_name: eth0
      port: 2152
    n4:
      interface_name: eth0
      port: 8805
    n6:
      interface_name: eth0
    n9:
      interface_name: eth0
      port: 2152
  udm:
    host: oai-udm
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
  udr:
    host: oai-udr
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
  ausf:
    host: oai-ausf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
  nrf:
    host: oai-nrf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0

database:
  host: mysql
  user: test
  type: mysql
  password: test
  database_name: oai_db
  generate_random: true
  connection_timeout: 300

amf:
  amf_name: "OAI-AMF"
  support_features_options:
    enable_simple_scenario: no
    enable_nssf: yes
    enable_smf_selection: no
  relative_capacity: 30
  statistics_timer_interval: 20
  emergency_support: false
  served_guami_list:
    - mcc: 001
      mnc: 01
      amf_region_id: 01
      amf_set_id: 001
      amf_pointer: 01
  plmn_support_list:
    - mcc: 001
      mnc: 01
      tac: 0x0001
      nssai:
        - *embb_slice
        - *urllc_slice
        - *mmtc_slice
  supported_integrity_algorithms:
    - "NIA1"
    - "NIA2"
  supported_encryption_algorithms:
    - "NEA0"
    - "NEA1"
    - "NEA2"

smf:
  ue_mtu: 1500
  support_features:
    use_local_subscription_info: no
    use_local_pcc_rules: yes
  upfs:
    - host: oai-upf
      config:
        enable_usage_reporting: no
      upf_info:
        sNssaiUpfInfoList:
        - sNssai: *embb_slice
          dnnUpfInfoList:
            - dnn: oai
            - dnn: oai2
            - dnn: oai-auto
    - host: osm-oai-upf.upf-auto-embb.svc.cluster.local
      config:
        enable_usage_reporting: no
      upf_info:
        sNssaiUpfInfoList:
        - sNssai: *embb_slice
          dnnUpfInfoList:
            - dnn: oai-ovf-embb
    - host: oai-upf2
      config:
        enable_usage_reporting: no
      upf_info:
        sNssaiUpfInfoList:
        - sNssai: *urllc_slice
          dnnUpfInfoList:
            - dnn: oai-urllc
    - host: oai-upf-auto-auto01
      config:
        enable_usage_reporting: no
      upf_info:
        sNssaiUpfInfoList:
        - sNssai: *mmtc_slice
          dnnUpfInfoList:
            - dnn: oai-mmtc
  ue_dns:
    primary_ipv4: "10.3.2.200"
    primary_ipv6: "2001:4860:4860::8888"
    secondary_ipv4: "8.8.8.8"
    secondary_ipv6: "2001:4860:4860::8888"
  ims:
    pcscf_ipv4: "192.168.70.139"
    pcscf_ipv6: "fe80::7915:f408:1787:db8b"
  smf_info:
    sNssaiSmfInfoList:
      - sNssai: *embb_slice
        dnnSmfInfoList:
          - dnn: "oai"
          - dnn: "oai2"
          - dnn: "oai-auto"
      - sNssai: *urllc_slice
        dnnSmfInfoList:
          - dnn: "oai-urllc"
      - sNssai: *mmtc_slice
        dnnSmfInfoList:
          - dnn: "oai-mmtc"
  local_subscription_infos:
    - single_nssai: *embb_slice
      dnn: "oai"
      qos_profile:
        5qi: 5
        session_ambr_ul: "200Mbps"
        session_ambr_dl: "400Mbps"
    - single_nssai: *embb_slice
      dnn: "oai2"
      qos_profile:
        5qi: 5
        session_ambr_ul: "200Mbps"
        session_ambr_dl: "400Mbps"
    - single_nssai: *embb_slice
      dnn: "oai-auto"
      qos_profile:
        5qi: 5
        session_ambr_ul: "200Mbps"
        session_ambr_dl: "400Mbps"
    - single_nssai: *urllc_slice
      dnn: "oai-urllc"
      qos_profile:
        5qi: 2
        session_ambr_ul: "50Mbps"
        session_ambr_dl: "100Mbps"
    - single_nssai: *mmtc_slice
      dnn: "oai-mmtc"
      qos_profile:
        5qi: 6
        session_ambr_ul: "10Mbps"
        session_ambr_dl: "20Mbps"

upf:
  support_features:
    enable_bpf_datapath: no
    enable_snat: yes
  remote_n6_gw: 127.0.0.1
  upf_info:
    sNssaiUpfInfoList:
    - sNssai: *embb_slice
      dnnUpfInfoList:
        - dnn: oai
        - dnn: oai2
        - dnn: oai-auto

dnns:
  - dnn: "oai"
    pdu_session_type: "IPV4"
    ipv4_subnet: "12.1.1.0/24"
  - dnn: "oai2"
    pdu_session_type: "IPV4"
    ipv4_subnet: "12.2.1.0/24"
  - dnn: "oai-auto"
    pdu_session_type: "IPV4"
    ipv4_subnet: "12.14.1.0/24"
  - dnn: "oai-urllc"
    pdu_session_type: "IPV4"
    ipv4_subnet: "12.2.1.0/24"
  - dnn: "oai-mmtc"
    pdu_session_type: "IPV4"
    ipv4_subnet: "12.3.1.0/24"
  - dnn: "oai-ovf-embb"
    pdu_session_type: "IPV4"
    ipv4_subnet: "12.10.1.0/24"
